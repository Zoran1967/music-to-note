name: Provera koda

on: [push]

jobs:
  provera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Proveri sintaksu svih .py fajlova
        run: |
          for f in $(find . -name "*.py"); do
            python -m py_compile "$f"
          done

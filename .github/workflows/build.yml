name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Preuzimanje koda iz repozitorijuma
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Podešavanje Python okruženja
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Instalacija neophodnih zavisnosti za Buildozer
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade Cython virtualenv

    # 4. Pokretanje ispravljene Buildozer akcije (korišćenjem @v1 umesto @v3)
    - name: Build with Buildozer
      uses: ArtemSBulgakov/buildozer-action@v1
      id: buildozer
      with:
        command: buildozer android debug
        buildozer_version: stable

    # 5. Čuvanje i otpremanje generisanog .apk fajla kao artefakta
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: ${{ steps.buildozer.outputs.filename }}
